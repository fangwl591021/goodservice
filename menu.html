<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rich Menu Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        canvas { border: 1px solid #e2e8f0; background-color: #f8fafc; }
        .area-card { border-bottom: 1px solid #f1f5f9; }
        .active-area { background-color: #f0fdf4; border-left: 2px solid #10b981; }
        input, select { border-bottom: 1px solid #e2e8f0 !important; border-radius: 0 !important; border-top: none !important; border-left: none !important; border-right: none !important; }
        input:focus, select:focus { border-bottom: 1px solid #10b981 !important; outline: none; }
    </style>
</head>
<body class="bg-white font-sans antialiased text-slate-700">

<div id="menu-workspace" class="flex flex-col h-screen overflow-hidden">
    <header class="bg-white border-b border-slate-100 py-3 px-6 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <button onclick="MenuModule.toggleDrawMode()" id="menu-draw-btn" class="px-5 py-2 rounded text-sm font-medium bg-[#1e293b] text-white transition-all hover:bg-slate-700">開始劃定區域</button>
            <button onclick="MenuModule.clearAreas()" class="px-5 py-2 rounded text-sm font-medium text-rose-500 border border-rose-100 hover:bg-rose-50">清空區域</button>
            
            <div class="h-6 w-px bg-slate-200 mx-2"></div>
            
            <input type="file" id="bg-upload" class="hidden" accept="image/*" onchange="MenuModule.handleImageUpload(event)">
            <button onclick="document.getElementById('bg-upload').click()" class="px-5 py-2 rounded text-sm font-medium text-blue-600 border border-blue-100 hover:bg-blue-50">上傳背景圖</button>
        </div>
        
        <div class="flex items-center space-x-2">
            <button onclick="MenuModule.applyJsonFromText()" class="px-5 py-2 rounded text-sm font-medium text-slate-500 border border-slate-200 hover:bg-slate-50">載入 JSON</button>
            <button onclick="copyJsonText()" class="px-5 py-2 rounded text-sm font-medium text-emerald-600 bg-emerald-50 border border-emerald-100 hover:bg-emerald-200 transition-colors uppercase">Copy JSON</button>
        </div>
    </header>

    <main class="flex flex-1 overflow-hidden">
        <section class="flex-1 overflow-auto p-8 flex flex-col bg-slate-50/50">
            <div class="mb-6 flex space-x-8 w-full max-w-3xl">
                <div class="flex-1">
                    <label class="block text-[10px] text-slate-400 mb-1 tracking-tight uppercase">選單名稱 (NAME)</label>
                    <input type="text" id="save-filename" value="New Rich Menu" class="w-full bg-transparent py-1.5 text-sm focus:outline-none transition-colors" placeholder="請輸入選單名稱">
                </div>
                <div class="flex-1">
                    <label class="block text-[10px] text-slate-400 mb-1 tracking-tight uppercase">聊天欄文字 (CHATBARTEXT)</label>
                    <input type="text" id="rich-menu-chatbar" value="開啟選單" class="w-full bg-transparent py-1.5 text-sm focus:outline-none transition-colors" placeholder="請輸入聊天欄文字">
                </div>
            </div>

            <div class="relative inline-block">
                <div id="menu-canvas-container" class="bg-white p-1 shadow-sm border border-slate-200 inline-block relative">
                    <canvas id="menu-canvas"></canvas>
                </div>
                <div class="mt-3 text-[10px] text-slate-400">
                    操作提示：上傳圖片後點擊「開始劃定」 / 於畫布拖曳繪製 / 選取區域後按 Delete 刪除
                </div>
            </div>
        </section>

        <aside class="w-80 border-l border-slate-100 bg-white flex flex-col">
            <div class="px-4 py-3 border-b border-slate-50">
                <h2 class="text-[11px] font-medium text-slate-400 uppercase tracking-widest">區域動作設定</h2>
            </div>
            
            <div id="editor-ui" class="flex-1 overflow-y-auto p-0 no-scrollbar">
                <div class="h-full flex items-center justify-center text-slate-400 text-xs italic text-center px-8 py-20">請先上傳背景圖並劃定區域</div>
            </div>

            <div class="p-4 border-t border-slate-100 bg-slate-50">
                <label class="block text-[10px] text-slate-400 mb-2 uppercase tracking-tighter font-medium">JSON 輸出</label>
                <textarea id="json-output" readonly class="w-full h-40 text-[10px] font-mono p-3 bg-white border border-slate-200 rounded focus:outline-none no-scrollbar resize-none text-slate-500"></textarea>
            </div>
        </aside>
    </main>
</div>

<script>
window.MenuModule = (function() {
    var canvas, isDrawingMode = false, isMouseDown = false, currentRect, startX, startY;
    var currentImgHeight = 843; // 預設 2500x843
    var baseScaleWidth = 2500;

    return {
        init: function() {
            if (!canvas) {
                canvas = new fabric.Canvas('menu-canvas', { 
                    selection: true,
                    preserveObjectStacking: true,
                    backgroundColor: '#ffffff'
                });
                this.bindEvents();
                
                window.addEventListener('keydown', (e) => {
                    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return; 
                    if (e.key === 'Delete' || e.key === 'Backspace') {
                        var active = canvas.getActiveObject();
                        if (active) {
                            canvas.remove(active);
                            this.updateOutput();
                        }
                    }
                });

                canvas.setWidth(600);
                canvas.setHeight(400);
            }
        },

        handleImageUpload: function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                this.load(file.name, "", event.target.result);
            };
            reader.readAsDataURL(file);
        },

        load: function(name, jsonStr, base64) {
            const self = this;
            let data = {};
            if (jsonStr) {
                try { data = JSON.parse(decodeURIComponent(jsonStr)); } catch(e) { console.error("JSON parse error", e); }
            }
            
            const tempImg = new Image();
            tempImg.onload = function() {
                const ratio = tempImg.height / tempImg.width;
                currentImgHeight = Math.round(baseScaleWidth * ratio);
                const displayWidth = 600;
                const displayHeight = displayWidth * ratio;
                
                canvas.setWidth(displayWidth);
                canvas.setHeight(displayHeight);

                fabric.Image.fromURL(base64, function(img) {
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                        scaleX: displayWidth / img.width,
                        scaleY: displayHeight / img.height
                    });
                    self.importAreas(data.areas || [], displayWidth / baseScaleWidth);
                });
            };
            tempImg.src = base64;
        },

        bindEvents: function() {
            const self = this;
            canvas.on('mouse:down', function(o) {
                if (!isDrawingMode) return;
                const pointer = canvas.getPointer(o.e);
                if (canvas.findTarget(o.e)) return;

                isMouseDown = true;
                startX = pointer.x;
                startY = pointer.y;

                currentRect = new fabric.Rect({
                    left: startX, top: startY, width: 0, height: 0,
                    fill: 'rgba(16, 185, 129, 0.1)', stroke: '#10b981', strokeWidth: 1,
                    cornerColor: '#10b981', cornerSize: 6, transparentCorners: false,
                    hasRotatingPoint: false
                });
                
                currentRect.action = { type: 'uri', uri: 'https://' };
                canvas.add(currentRect);
                canvas.setActiveObject(currentRect);
            });

            canvas.on('mouse:move', function(o) {
                if (!isDrawingMode || !isMouseDown || !currentRect) return;
                const pointer = canvas.getPointer(o.e);
                const left = Math.min(startX, pointer.x);
                const top = Math.min(startY, pointer.y);
                const width = Math.abs(startX - pointer.x);
                const height = Math.abs(startY - pointer.y);

                currentRect.set({ left: left, top: top, width: width, height: height });
                canvas.renderAll();
            });

            canvas.on('mouse:up', function() {
                if (!isDrawingMode || !isMouseDown) return;
                isMouseDown = false;
                
                if (currentRect && (currentRect.width < 5 || currentRect.height < 5)) {
                    canvas.remove(currentRect);
                } else {
                    currentRect.setCoords();
                    self.toggleDrawMode(false);
                    self.updateOutput();
                }
                currentRect = null;
            });

            canvas.on('object:modified', () => self.updateOutput(true));
            canvas.on('selection:created', (e) => self.focusEditorItem(e.selected[0]));
            canvas.on('selection:updated', (e) => self.focusEditorItem(e.selected[0]));
        },

        toggleDrawMode: function(force) {
            isDrawingMode = (force !== undefined) ? force : !isDrawingMode;
            const btn = document.getElementById('menu-draw-btn');
            if (isDrawingMode) {
                btn.innerText = '正在劃定中...';
                btn.classList.replace('bg-[#1e293b]', 'bg-emerald-600');
                canvas.defaultCursor = 'crosshair';
                canvas.selection = false;
            } else {
                btn.innerText = '開始劃定區域';
                btn.classList.replace('bg-emerald-600', 'bg-[#1e293b]');
                canvas.defaultCursor = 'default';
                canvas.selection = true;
            }
        },

        focusEditorItem: function(obj) {
            if (!obj || obj.type !== 'rect') return;
            const rects = canvas.getObjects('rect');
            const idx = rects.indexOf(obj);
            const target = document.getElementById('area-item-' + idx);
            if (target) {
                document.querySelectorAll('.area-card').forEach(el => el.classList.remove('active-area'));
                target.classList.add('active-area');
                target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        },

        updateOutput: function(skipRenderUI) {
            if (!canvas) return;
            const objects = canvas.getObjects('rect');
            const scale = baseScaleWidth / (canvas.getWidth() || 600);
            const chatBar = document.getElementById('rich-menu-chatbar')?.value || "選單";
            const filename = document.getElementById('save-filename')?.value || "New Rich Menu";
            
            const areas = objects.map(function(o) {
                return {
                    bounds: {
                        x: Math.round(o.left * scale),
                        y: Math.round(o.top * scale),
                        width: Math.round(o.getScaledWidth() * scale),
                        height: Math.round(o.getScaledHeight() * scale)
                    },
                    action: o.action || { type: 'uri', uri: 'https://' }
                };
            });

            const result = {
                size: { width: baseScaleWidth, height: currentImgHeight },
                selected: true,
                name: filename,
                chatBarText: chatBar,
                areas: areas
            };

            const out = document.getElementById('json-output');
            if (out) out.value = JSON.stringify(result, null, 2);
            
            if (!skipRenderUI) this.renderAreaEditor(areas);
            this.refreshCanvasLabels();
        },

        refreshCanvasLabels: function() {
            const labels = canvas.getObjects('text');
            labels.forEach(l => canvas.remove(l));
            const rects = canvas.getObjects('rect');
            rects.forEach((r, idx) => {
                const t = new fabric.Text('#' + (idx + 1), {
                    left: r.left + 2, top: r.top + 2,
                    fontSize: 10, fill: '#ffffff',
                    backgroundColor: '#10b981', selectable: false, evented: false,
                    padding: 2
                });
                canvas.add(t);
            });
            canvas.renderAll();
        },

        renderAreaEditor: function(areas) {
            const container = document.getElementById('editor-ui');
            if(!container) return;
            if (areas.length === 0) {
                container.innerHTML = '<div class="h-full flex items-center justify-center text-slate-400 text-xs italic text-center px-8 py-20">請先上傳背景圖並劃定區域</div>';
                return;
            }

            container.innerHTML = '';
            areas.forEach((area, idx) => {
                const div = document.createElement('div');
                div.id = 'area-item-' + idx;
                div.className = "area-card p-4 transition-all cursor-pointer";
                div.onclick = () => {
                    const rects = canvas.getObjects('rect');
                    canvas.setActiveObject(rects[idx]);
                    canvas.renderAll();
                };
                
                const type = area.action.type;
                let actionFields = '';
                if (type === 'postback') {
                    actionFields = `
                        <input type="text" value="${area.action.data || ''}" class="w-full text-[10px] py-1 bg-transparent" placeholder="data" oninput="MenuModule.updateAreaProp(${idx}, 'data', this.value)">
                        <input type="text" value="${area.action.text || ''}" class="w-full text-[10px] py-1 bg-transparent" placeholder="text" oninput="MenuModule.updateAreaProp(${idx}, 'text', this.value)">
                    `;
                } else if (type === 'message') {
                    actionFields = `<input type="text" value="${area.action.text || ''}" class="w-full text-[10px] py-1 bg-transparent" placeholder="text" oninput="MenuModule.updateAreaProp(${idx}, 'text', this.value)">`;
                } else if (type === 'richmenuswitch') {
                    actionFields = `
                        <input type="text" value="${area.action.richMenuAliasId || ''}" class="w-full text-[10px] py-1 bg-transparent" placeholder="aliasId" oninput="MenuModule.updateAreaProp(${idx}, 'richMenuAliasId', this.value)">
                        <input type="text" value="${area.action.data || ''}" class="w-full text-[10px] py-1 bg-transparent" placeholder="data" oninput="MenuModule.updateAreaProp(${idx}, 'data', this.value)">
                    `;
                } else {
                    actionFields = `<input type="text" value="${area.action.uri || ''}" class="w-full text-[10px] py-1 bg-transparent" placeholder="https://" oninput="MenuModule.updateAreaProp(${idx}, 'uri', this.value)">`;
                }

                div.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[9px] text-slate-400 font-mono uppercase">ID #${idx+1} [${area.bounds.width}x${area.bounds.height}]</span>
                        <button onclick="event.stopPropagation(); MenuModule.removeArea(${idx})" class="text-[9px] text-rose-400">刪除</button>
                    </div>
                    <div class="space-y-1" onclick="event.stopPropagation()">
                        <select class="w-full text-xs py-1 bg-transparent mb-1" onchange="MenuModule.updateAreaProp(${idx}, 'type', this.value)">
                            <option value="uri" ${type==='uri'?'selected':''}>URI (超連結)</option>
                            <option value="message" ${type==='message'?'selected':''}>Message (訊息)</option>
                            <option value="postback" ${type==='postback'?'selected':''}>Postback (回傳)</option>
                            <option value="richmenuswitch" ${type==='richmenuswitch'?'selected':''}>Switch (切換)</option>
                        </select>
                        ${actionFields}
                    </div>
                `;
                container.appendChild(div);
            });
        },

        updateAreaProp: function(idx, prop, val) {
            const objects = canvas.getObjects('rect');
            if(!objects[idx]) return;
            if(!objects[idx].action) objects[idx].action = {};
            if(prop === 'type') {
                objects[idx].action = { type: val };
                this.updateOutput(false); 
            } else {
                objects[idx].action[prop] = val;
                this.updateOutput(true); 
            }
        },

        removeArea: function(idx) {
            const objects = canvas.getObjects('rect');
            if(objects[idx]) { canvas.remove(objects[idx]); this.updateOutput(); }
        },

        importAreas: function(areas, scale) {
            if (!canvas) return;
            canvas.getObjects('rect').forEach(o => canvas.remove(o));
            areas.forEach(a => {
                const r = new fabric.Rect({
                    left: (a.bounds.x || 0) * scale, top: (a.bounds.y || 0) * scale,
                    width: (a.bounds.width || 0) * scale, height: (a.bounds.height || 0) * scale,
                    fill: 'rgba(16, 185, 129, 0.1)', stroke: '#10b981', strokeWidth: 1,
                    cornerColor: '#10b981', cornerSize: 6, transparentCorners: false,
                    hasRotatingPoint: false
                });
                r.action = a.action || { type: 'uri', uri: 'https://' };
                canvas.add(r);
            });
            canvas.renderAll();
            this.updateOutput();
        },

        clearAreas: function() {
            if(confirm("確定清空區域？")) {
                canvas.getObjects('rect').forEach(o => canvas.remove(o));
                this.updateOutput();
            }
        },

        applyJsonFromText: function() {
            const input = prompt("貼上 JSON：");
            if (input) {
                try {
                    const data = JSON.parse(input);
                    const scale = (canvas.getWidth() || 600) / (data.size?.width || baseScaleWidth);
                    this.importAreas(data.areas || [], scale);
                } catch(e) { alert("JSON 錯誤"); }
            }
        }
    };
})();

function copyJsonText() {
    const copyText = document.getElementById("json-output");
    if (!copyText.value) return;
    copyText.select();
    document.execCommand("copy");
    const btn = event.target;
    btn.innerText = "COPIED";
    setTimeout(() => { btn.innerText = "COPY JSON"; }, 1500);
}

window.onload = function() {
    MenuModule.init();
};
</script>
</body>
</html>
